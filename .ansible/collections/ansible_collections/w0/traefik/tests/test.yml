---
# Smoke playbook for the role checked out in-repo (not the installed Galaxy
# collection name) — this keeps it runnable from a fresh clone:
#   ansible-playbook -i tests/inventory tests/test.yml
- name: Test Traefik role
  hosts: all
  become: true
  roles:
    - role: "{{ playbook_dir | dirname }}"
      traefik_version: v3.6.2

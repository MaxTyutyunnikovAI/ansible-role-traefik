---
# ============================================================================
# Traefik v3 role - defaults (all values overridable from inventory/vars)
# ============================================================================

# Version & download ---------------------------------------------------------
traefik_version: "v3.6.2"                      # pinned v3.x release tag
traefik_repo_url: "https://github.com/traefik/traefik"
traefik_binary_url: "{{ traefik_repo_url }}/releases/download/{{ traefik_version }}/traefik_{{ traefik_version }}_linux_{{ go_arch }}.tar.gz"
# sha256 of the tarball above. Strongly recommended to pin per version.
# When left empty, install.yml fetches it from the official upstream
# traefik_<version>_checksums.txt asset (verified against GitHub Releases).
traefik_checksum: ""
traefik_checksums_url: "{{ traefik_repo_url }}/releases/download/{{ traefik_version }}/traefik_{{ traefik_version }}_checksums.txt"
traefik_download_tmp_dir: "/tmp/traefik-download"

# Users / paths ---------------------------------------------------------------
traefik_service_name: "traefik"
traefik_system_user: "traefik"
traefik_system_group: "traefik"
traefik_bin_dir: "/usr/local/bin"
traefik_config_dir: "/etc/traefik"
traefik_static_config_file: "{{ traefik_config_dir }}/traefik.yml"
traefik_dynamic_config_dir: "{{ traefik_config_dir }}/conf.d"   # File Provider directory
traefik_log_dir: "/var/log/traefik"
traefik_data_dir: "/var/lib/traefik"           # acme.json, runtime state

# Ownership / modes -----------------------------------------------------------
traefik_config_owner: "{{ traefik_system_user }}"
traefik_config_group: "{{ traefik_system_group }}"
traefik_config_mode: "0640"
traefik_directory_mode: "0750"

# Systemd unit knobs ----------------------------------------------------------
traefik_start_timeout: 30                      # StartSec in seconds
traefik_restart_sec: 5                         # RestartSec in seconds
traefik_limit_nofile: 1048576
traefik_extra_capabilities: []                 # e.g. ["CAP_NET_RAW"]
# Free-form extra [Service] keys rendered as "Key=value" lines at the end of
# the unit template. Example: { TasksMax: 300000, OOMPolicy: continue }
traefik_extra_unit_vars: {}

# Dashboard / API -------------------------------------------------------------
# Off by default: an exposed dashboard is a production risk. To serve it on a
# public entry point, keep traefik_dashboard_insecure false and put an auth
# middleware in front of api@internal via traefik_dynamic_configs (see README).
traefik_dashboard_enabled: false               # api.dashboard flag
traefik_dashboard_insecure: false              # api.insecure - localhost debugging only

# Logrotate -------------------------------------------------------------------
traefik_logrotate_enabled: true
traefik_logrotate_frequency: "daily"
traefik_logrotate_rotate: 14
traefik_logrotate_maxsize: "100M"

# ----------------------------------------------------------------------------
# STATIC CONFIGURATION (declarative dict -> rendered with to_nice_yaml(indent=2))
# Entry points web/websecure, ACME resolver letsencrypt, logging, accessLog,
# api dashboard (via flags above), file provider.
# NOTE: when overriding traefik_static_config from inventory, provide the whole
# dict - Ansible replaces (not merges) top-level role default variables.
# ----------------------------------------------------------------------------
traefik_static_config:
  global:
    checkNewVersion: false
    sendAnonymousUsage: false

  entryPoints:
    web:
      address: ":80"
      http:
        redirections:
          entryPoint:
            to: websecure
            scheme: https
    websecure:
      address: ":443"
      http:
        tls:
          certResolver: letsencrypt

  # The default websecure entry point references certResolver "letsencrypt";
  # without certificatesResolvers below it would silently fail. TLS-ALPN-01 on
  # the already-managed :443 entry point needs no extra open ports. Set a real
  # email for production use (ACME registration requirement).
  certificatesResolvers:
    letsencrypt:
      acme:
        email: ""
        storage: "{{ traefik_data_dir }}/acme.json"
        caServer: "https://acme-v02.api.letsencrypt.org/directory"
        keyType: EC256

  log:
    level: INFO
    format: json
    filePath: "{{ traefik_log_dir }}/traefik.log"

  accessLog:
    format: json
    filePath: "{{ traefik_log_dir }}/access.log"
    fields:
      headers:
        defaultMode: drop
        names:
          User-Agent: keep

  api:
    dashboard: "{{ traefik_dashboard_enabled | bool }}"
    insecure: "{{ traefik_dashboard_insecure | bool }}"

  providers:
    file:
      directory: "{{ traefik_dynamic_config_dir }}"
      watch: true

# ----------------------------------------------------------------------------
# DYNAMIC CONFIGURATION (File Provider). Each list item is rendered as a
# separate YAML file into traefik_dynamic_config_dir via a loop in configure.yml.
# conf.d is managed declaratively: any *.yml not listed here is pruned so that
# removed routers/services do not linger as stale rules.
# ----------------------------------------------------------------------------
traefik_dynamic_configs:
  - name: tls-options
    content:
      tls:
        options:
          default:
            minVersion: VersionTLS12
            sniStrict: true
            cipherSuites:
              - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
              - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
              - TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305
              - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305
            curvePreferences:
              - CurveP521
              - CurveP384
# Example of an additional dynamic file (routers/services/middlewares):
# - name: shared-routers
#   content:
#     http:
#       routers: ...

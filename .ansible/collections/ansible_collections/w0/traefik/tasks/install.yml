---
# ============================================================================
# Install: system group/user, directory layout, Traefik v3 binary from GitHub.
# Idempotency: the tar.gz is downloaded/unpacked only when the installed
# binary is missing or reports a version different from traefik_version.
# Integrity: the tarball sha256 is ALWAYS verified — either against the
# pinned traefik_checksum or against the official upstream checksums.txt.
# ============================================================================

- name: Assert that the target uses systemd as init system
  ansible.builtin.assert:
    that: ansible_facts["service_mgr"] == "systemd"
    fail_msg: "This role requires a systemd-based distribution."
    quiet: true

- name: Create Traefik system group
  ansible.builtin.group:
    name: "{{ traefik_system_group }}"
    state: present
    system: true
  when: traefik_system_group != "root"

- name: Create Traefik system user
  ansible.builtin.user:
    name: "{{ traefik_system_user }}"
    group: "{{ traefik_system_group }}"
    shell: /usr/sbin/nologin          # no interactive login for the service account
    system: true
    create_home: false
    home: "{{ traefik_data_dir }}"
    state: present
  when: traefik_system_user != "root"

- name: Ensure Traefik directories exist with correct ownership and modes
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default(traefik_system_user) }}"
    group: "{{ item.group | default(traefik_system_group) }}"
    mode: "{{ item.mode | default(traefik_directory_mode) }}"
  loop:
    - path: "{{ traefik_bin_dir }}"
      owner: root
      group: root
      mode: "0755"
    - path: "{{ traefik_config_dir }}"
      owner: "{{ traefik_config_owner }}"
      group: "{{ traefik_config_group }}"
    - path: "{{ traefik_dynamic_config_dir }}"
      owner: "{{ traefik_config_owner }}"
      group: "{{ traefik_config_group }}"
    - path: "{{ traefik_log_dir }}"
    - path: "{{ traefik_data_dir }}"
  loop_control:
    label: "{{ item.path }}"

- name: Check whether the Traefik binary is already present
  ansible.builtin.stat:
    path: "{{ traefik_bin_dir }}/traefik"
  register: traefik_binary_stat
  changed_when: false
  check_mode: false

- name: Get currently installed Traefik version
  ansible.builtin.command:
    argv:
      - "{{ traefik_bin_dir }}/traefik"
      - version
  register: traefik_installed_version
  changed_when: false
  failed_when: false
  check_mode: false
  when: traefik_binary_stat.stat.exists | bool

# needs_install is True on first run or when the pinned version has changed.
# NOTE: `traefik version` prints "Version:  3.6.2" WITHOUT the leading "v"
# of the git tag, so we compare against the tag with the "v" stripped.
- name: Determine if Traefik binary must be (re)installed
  ansible.builtin.set_fact:
    traefik_needs_install: >-
      {{ not (traefik_binary_stat.stat.exists | bool)
         or (traefik_version[1:] if traefik_version is match('^v') else traefik_version)
            not in (traefik_installed_version.stdout | default('')) }}

- name: Download and unpack Traefik release tarball from GitHub
  when: traefik_needs_install | bool
  block:
    - name: Create temporary download directory
      ansible.builtin.file:
        path: "{{ traefik_download_tmp_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    # Integrity gate. Two supported modes:
    #  * traefik_checksum set -> use it verbatim (fully pinned, offline-capable);
    #  * traefik_checksum empty -> fetch the official release checksums.txt
    #    asset with uri (on the CONTROL node, no target scratch files) and pick
    #    the line matching our exact tarball filename.
    # The resolved value is handed to unarchive's checksum:, which fails the
    # task hard on any mismatch — a corrupted/tampered download can never
    # reach the binary path. In check mode the download chain is skipped.
    - name: Download upstream release checksums file
      ansible.builtin.uri:
        url: "{{ traefik_checksums_url }}"
        return_content: true
      register: traefik_checksums_uri
      changed_when: false
      when:
        - traefik_checksum | length == 0
        - not ansible_check_mode

    - name: Resolve the expected sha256 of the tarball
      ansible.builtin.set_fact:
        traefik_effective_checksum: >-
          {{ (traefik_checksums_uri.content | default('') | splitlines(false)
              | select('search', 'traefik_' ~ traefik_version ~ '_linux_' ~ go_arch ~ '\.tar\.gz$')
              | map('regex_search', '^[0-9a-f]{64}')
              | first | default('', true)) }}
      when:
        - not ansible_check_mode
        - traefik_checksum | length == 0
        - traefik_checksums_uri.content is defined

    - name: Resolve the pinned sha256 of the tarball
      ansible.builtin.set_fact:
        traefik_effective_checksum: "{{ traefik_checksum }}"
      when:
        - not ansible_check_mode
        - traefik_checksum | length > 0

    - name: Assert that a sha256 checksum was resolved for the tarball
      ansible.builtin.assert:
        that: traefik_effective_checksum | default('') | regex_findall('^[0-9a-fA-F]{64}$') | length == 1
        fail_msg: >-
          Could not determine sha256 for {{ traefik_binary_url }}. Pin
          traefik_checksum explicitly or verify access to
          {{ traefik_checksums_url }}.
        success_msg: "Tarball checksum resolved: {{ traefik_effective_checksum }}"
      when: not ansible_check_mode

    - name: Unarchive Traefik binary archive (remote_src, verified checksum)
      ansible.builtin.unarchive:
        src: "{{ traefik_binary_url }}"
        dest: "{{ traefik_download_tmp_dir }}"
        remote_src: true
        checksum: "sha256:{{ traefik_effective_checksum }}"
        extra_opts:
          - --no-same-owner
        creates: "{{ traefik_download_tmp_dir }}/traefik"
      when: not ansible_check_mode

    - name: Install Traefik binary into {{ traefik_bin_dir }}
      ansible.builtin.copy:
        src: "{{ traefik_download_tmp_dir }}/traefik"
        dest: "{{ traefik_bin_dir }}/traefik"
        owner: root
        group: root
        mode: "0755"
        remote_src: true
      when: not ansible_check_mode
      # A binary upgrade by itself does NOT restart the proxy; any restart is
      # always routed through the validate_and_restart_traefik handler chain.

    - name: Remove temporary download directory
      ansible.builtin.file:
        path: "{{ traefik_download_tmp_dir }}"
        state: absent

- name: Restore SELinux context for the Traefik binary
  ansible.builtin.command:
    argv:
      - restorecon
      - -v
      - "{{ traefik_bin_dir }}/traefik"
  register: traefik_restorecon
  changed_when: "'relabeled' in traefik_restorecon.stdout"
  when:
    - ansible_facts["selinux"] is defined
    - ansible_facts["selinux"].status == "enabled"
    - not ansible_check_mode

---
# ============================================================================
# Configure: declarative static config (dict -> to_nice_yaml) + File Provider
# dynamic configs rendered via a loop over traefik_dynamic_configs.
# conf.d is managed declaratively: files not present in the list are pruned,
# so removed routers/services never linger as stale rules.
# Static-config changes notify the validated-restart handler chain — the
# service is restarted ONLY if `traefik --check` passes (see handlers).
# Dynamic-file changes do NOT notify it: providers.file.watch=true applies
# them at runtime without a restart (and offline schema validation for them
# is not available — see note at the bottom of this file).
# ============================================================================

- name: Generate static Traefik configuration from traefik_static_config dict
  ansible.builtin.template:
    src: traefik.yml.j2
    dest: "{{ traefik_static_config_file }}"
    owner: "{{ traefik_config_owner }}"
    group: "{{ traefik_config_group }}"
    mode: "{{ traefik_config_mode }}"
    # No inline `validate:` here: `traefik --check` binds entrypoint sockets,
    # which would make temp-file validation hang/conflict with the running
    # instance. The final file is validated in the handler chain (below the
    # notify) before any restart — that is the authoritative gate.
    # lstrip_blocks keeps the rendered YAML clean when conditionals are added.
    lstrip_blocks: true
    trim_blocks: true
  notify: validate_and_restart_traefik

- name: Render dynamic configuration files (File Provider) from traefik_dynamic_configs
  ansible.builtin.copy:
    # Each item.content dict is serialized declaratively with to_nice_yaml.
    content: "{{ item.content | to_nice_yaml(indent=2) }}"
    dest: "{{ traefik_dynamic_config_dir }}/{{ item.name }}.yml"
    owner: "{{ traefik_config_owner }}"
    group: "{{ traefik_config_group }}"
    mode: "{{ traefik_config_mode }}"
  loop: "{{ traefik_dynamic_configs }}"
  loop_control:
    label: "{{ traefik_dynamic_config_dir }}/{{ item.name }}.yml"

- name: Discover existing dynamic configuration files in {{ traefik_dynamic_config_dir }}
  ansible.builtin.find:
    paths: "{{ traefik_dynamic_config_dir }}"
    patterns: "*.yml,*.yaml"
  register: traefik_dynamic_files_found
  changed_when: false
  # Runs on the TARGET and must see the real filesystem even under --check,
  # otherwise a subsequent --check run would prune nothing and the check-mode
  # result would diverge from a normal run.
  check_mode: false

# Declarative pruning: anything in conf.d that is not declared in
# traefik_dynamic_configs is removed (the directory belongs exclusively to
# this role; deploy custom files elsewhere or override the variable).
- name: Prune undeclared dynamic configuration files
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ traefik_dynamic_files_found.files
            | rejectattr('path', 'in', traefik_managed_dynamic_paths)
            | list }}"
  loop_control:
    label: "{{ item.path }}"
  vars:
    # Built with a Jinja for-loop so names containing regex metacharacters
    # (dots, plus signs) are handled literally — no regex_replace needed.
    traefik_managed_dynamic_paths: |-
      {%- set managed = [] -%}
      {%- for cfg in traefik_dynamic_configs -%}
        {%- set _ = managed.append(traefik_dynamic_config_dir ~ '/' ~ cfg.name ~ '.yml') -%}
      {%- endfor -%}
      {{ managed }}

# NOTE ON DYNAMIC CONFIG VALIDATION (verified empirically with Traefik v3):
# `traefik --configFile=<file> --check` validates ONLY static configuration and
# binds entrypoint sockets while checking. File Provider dynamic resources are
# loaded at runtime (providers.file.watch=true applies them without a restart),
# and TLS options are resolved only during an actual handshake — so there is no
# safe offline schema-validation for them. The authoritative gate before any
# restart is the static-config validation performed in the handler chain.

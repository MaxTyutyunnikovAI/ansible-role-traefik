---
# Converge playbook for the default Molecule scenario.
- name: Converge — apply the Traefik v3 role
  hosts: all
  become: true
  gather_facts: true

  pre_tasks:
    # Minimal host preparation for a bare RockyLinux 9 container image:
    # unarchive module needs tar/gzip; logrotate ships the cron job that
    # reads MainPID via systemctl (procps-ng/pgrep is no longer required).
    - name: Install required packages for the role
      ansible.builtin.package:
        name:
          - tar
          - gzip
          - logrotate
        state: present

  roles:
    - role: traefik

---
# ============================================================================
# Пример плейбука: Traefik v3 (systemd) + Kubernetes-провайдеры (k3s)
# ----------------------------------------------------------------------------
# Сценарий: сервер(ы) с k3s. Traefik работает как systemd-сервис на хосте
# кластера и подключается к kube-apiserver внешним клиентом провайдеров:
# endpoint + SA-токен + CA-бандл (certAuthFilePath). Роль включает все три
# провайдера разом (traefik_kubernetes_enabled): kubernetesIngress,
# kubernetesCRD и kubernetesGateway — каждый дополнительно настраивается
# своими переменными (см. defaults/main.yml роли).
#
# Особенности k3s:
#   * в k3s уже встроен свой Traefik (Chart helm-install-traefik) — его нужно
#     удалить, иначе два ingress-контроллера будут конфликтовать;
#   * API: https://127.0.0.1:6443 (порт k3s https), сервисный namespace —
#     kube-system, токен: secret из ServiceAccount `traefik` (создаём ниже);
#   * в статике Traefik v3 НЕТ поля `kubeconfig` — v3 его отвергает с
#     "field not found" (проверено на v3.7.14). Вместо kubeconfig-файла:
#     endpoint+token+certAuthFilePath (здесь) либо env KUBECONFIG через
#     traefik_envs;
#   * ошибки инициализации kubernetes-провайдеров (недоступный API, нет CA)
#     уходят только в лог-файл — они не видны в stderr и не могут сломать
#     тайм-аутную пробу перезапуска роли.
#
# Запуск:
#   ansible-playbook -i inventory.ini docs/examples/playbook-k3s-provider.yml
# ============================================================================

- name: Install Traefik with Kubernetes providers on a k3s server
  hosts: k3s_servers
  become: true

  vars:
    traefik_version: v3.7.14

    # ------------------------------------------------------------------
    # Kubernetes-провайдеры (первоклассные переменные роли — merge
    # traefik_static_config для k8s НЕ нужен; см. docs/README.md).
    # ------------------------------------------------------------------
    traefik_kubernetes_enabled: true
    traefik_kubernetes_endpoint: "https://127.0.0.1:6443"
    # Токен читается в tasks ниже (set_fact traefik_k8s_token); default('')
    # нужен, чтобы vars шаблонизировались без ошибок до чтения secret.
    traefik_kubernetes_token: "{{ traefik_k8s_token | default('') }}"
    # CA кладём в каталог роли (юнит читает его от пользователя traefik;
    # исходный /var/lib/rancher/k3s/... доступен только root).
    traefik_kubernetes_cert_auth_file: "/etc/traefik/k3s-client-ca.crt"
    traefik_kubernetes_ingress_class: "traefik"
    traefik_kubernetes_crd_extra:
      allowExternalNameServices: true
      allowEmptyServices: true
    # Фильтр по namespaces / label'ам — через per-provider extras:
    #   traefik_kubernetes_ingress_extra: {namespaces: [default, ingress]}
    # Внимание: опции строгие для каждого провайдера: allowExternalNameServices
    # валиден только в kubernetesCRD и попадёт в kubernetesIngress — ошибка
    # парсинга конфига ("field not found").

    # Динамическая конфигурация (File Provider) — TLS-настройки по умолчанию
    # и middlewares, доступные из Ingress-аннотаций как middleware@file.
    traefik_dynamic_configs:
      - name: tls-options
        content:
          tls:
            options:
              default:
                minVersion: VersionTLS12
                sniStrict: false           # SNI strict может ломать health-check'и LB
      # Плагины подключаются динамической конфигурацией: middleware вида
      # "<name>@plugin", где <name> — ключ из experimental.plugins. В k8s на
      # него также можно ссылаться через CRD Middleware (traefik.io/v1alpha1).
      - name: plugin-middlewares
        content:
          http:
            middlewares:
              keep-response-body:
                plugin:
                  geohamster-keep: {}      # настройки плагина (см. README модуля)

    traefik_enable_acme: true
    traefik_cert_resolvers:
      letsencrypt:
        acme:
          email: ops@example.com
          storage: "{{ traefik_data_dir }}/acme.json"
          httpChallenge:
            entryPoint: web

    # ------------------------------------------------------------------
    # Плагины Traefik v3 (механизм trial + Traefik Pilot).
    # Плагин = Yaegi-скрипт с pilot.traefik.io; «установка» — это:
    #   1) блок pilot + experimental.plugins в статике (делает роль),
    #   2) предзагрузка исходников `traefik trial --download` (таска configure.yml),
    #   3) middleware, использующий плагин (<name>@plugin в динамической конфиге).
    # Токен — секрет: ansible-vault edit group_vars/k3s_servers/vault.yml
    #   traefik_pilot_token_vault: "TRIAL-xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
    # ------------------------------------------------------------------
    traefik_pilot_enabled: true
    traefik_pilot_token: "{{ traefik_pilot_token_vault | default('') }}"
    traefik_plugins:
      - name: geohamster-keep
        version: v0.1.0
        moduleName: github.com/geohamster/traefik-plugin

  tasks:
    # ------------------------------------------------------------------
    # 1. Удалить встроенный Traefik из k3s (конфликт двух ingress-контроллеров).
    # ------------------------------------------------------------------
    - name: Uninstall bundled k3s Traefik chart
      ansible.builtin.command: k3s helm uninstall traefik -n kube-system
      register: _helm_uninstall
      failed_when:
        - _helm_uninstall.rc != 0
        - "'not found' not in _helm_uninstall.stderr"
      changed_when: _helm_uninstall.rc == 0

    # ------------------------------------------------------------------
    # 2. Сервис-аккаунт и токен для доступа Traefik к API кластера.
    #    В проде вместо cluster-admin — минимальный ClusterRole на чтение
    #    ingress/services/secrets/ingressclasses + CRD traefik.io.
    # ------------------------------------------------------------------
    - name: Create Traefik service account
      ansible.builtin.command: k3s kubectl create serviceaccount traefik -n kube-system
      register: _sa
      failed_when:
        - _sa.rc != 0
        - "'already exists' not in _sa.stderr"
      changed_when: _sa.rc == 0

    - name: Bind cluster-admin role to the Traefik service account
      ansible.builtin.command: >-
        k3s kubectl create clusterrolebinding traefik
        --clusterrole=cluster-admin
        --serviceaccount=kube-system:traefik
      register: _crb
      failed_when:
        - _crb.rc != 0
        - "'already exists' not in _crb.stderr"
      changed_when: _crb.rc == 0

    - name: Read the long-lived token of the Traefik service account
      ansible.builtin.shell: >-
        set -o pipefail &&
        k3s kubectl get secret -n kube-system
        $(k3s kubectl get serviceaccount traefik -n kube-system -o jsonpath='{.secrets[0].name}')
        -o jsonpath='{.data.token}' | base64 -d
      register: _k8s_token
      changed_when: false
      no_log: true

    - name: Set Traefik Kubernetes token fact
      ansible.builtin.set_fact:
        traefik_k8s_token: "{{ _k8s_token.stdout }}"
      no_log: true

    # ------------------------------------------------------------------
    # 3. CA-бандл кластера — рядом с конфигом роли (0644), чтобы сервис
    #    traefik мог прочитать его для проверки сертификата kube-apiserver.
    # ------------------------------------------------------------------
    - name: Ensure Traefik config directory exists
      ansible.builtin.file:
        path: /etc/traefik
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Copy k3s CA certificate for Traefik
      ansible.builtin.copy:
        src: /var/lib/rancher/k3s/server/tls/client-ca.crt
        dest: /etc/traefik/k3s-client-ca.crt
        remote_src: true
        owner: root
        group: root
        mode: "0644"

    # ------------------------------------------------------------------
    # 4. Роль. Все k8s-переменные заданы в vars плейбука — merge
    #    traefik_static_config больше не требуется: блок providers.kubernetes*
    #    рендерит сама роль, file-provider и прочие провайдеры сохраняются.
    #    Задача шаблона статики при непустом токене идёт с no_log.
    # ------------------------------------------------------------------
    - name: Apply w0.traefik role with Kubernetes providers enabled
      ansible.builtin.include_role:
        name: w0.traefik

    # ------------------------------------------------------------------
    # 5. IngressClass и демо-Ingress (проверка работы провайдера).
    #    Роль по умолчанию фильтрует по ingressClass=traefik — сам объект
    #    IngressClass она в кластер не создаёт (кластерные манифесты вне
    #    зоны роли): создаём здесь.
    # ------------------------------------------------------------------
    - name: Ensure Traefik IngressClass exists
      ansible.builtin.copy:
        dest: /tmp/traefik-ingressclass.yml
        mode: "0644"
        content: |
          apiVersion: networking.k8s.io/v1
          kind: IngressClass
          metadata:
            name: traefik
          spec:
            controller: traefik.io/ingress-controller
      changed_when: false

    - name: Apply IngressClass
      ansible.builtin.command: k3s kubectl apply -f /tmp/traefik-ingressclass.yml
      changed_when: false

    # CRD Traefik (IngressRoute/Middleware) ставит сам kubernetesCRD при первом
    # подключении к API — ждём, затем объявляем demo-Middleware на плагине.
    - name: Wait for Traefik CRDs to be registered by the provider
      ansible.builtin.command: k3s kubectl wait --for condition=established --timeout=120s \
        crd/middlewares.traefik.io
      register: _crd_wait
      changed_when: false
      retries: 5
      delay: 5
      until: _crd_wait.rc == 0

    - name: Deploy demo plugin Middleware (CRD traefik.io/v1alpha1)
      ansible.builtin.copy:
        dest: /tmp/whoami-middleware.yml
        mode: "0644"
        content: |
          apiVersion: traefik.io/v1alpha1
          kind: Middleware
          metadata:
            name: keep-response-body
            namespace: default
          spec:
            plugin:
              geohamster-keep: {}
      changed_when: false

    - name: Apply demo plugin Middleware
      ansible.builtin.command: k3s kubectl apply -f /tmp/whoami-middleware.yml
      register: _mw_apply
      changed_when: "'configured' in _mw_apply.stdout or 'created' in _mw_apply.stdout"

    - name: Deploy demo whoami app behind Traefik via Ingress
      ansible.builtin.copy:
        dest: /tmp/whoami-ingress.yml
        mode: "0644"
        content: |
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: whoami
            namespace: default
          spec:
            replicas: 1
            selector:
              matchLabels: {app: whoami}
            template:
              metadata:
                labels: {app: whoami}
              spec:
                containers:
                  - name: whoami
                    image: traefik/whoami
                    ports: [{containerPort: 80}]
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: whoami
            namespace: default
          spec:
            selector: {app: whoami}
            ports: [{port: 80, targetPort: 80}]
          ---
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: whoami
            namespace: default
            annotations:
              kubernetes.io/ingress.class: traefik
              traefik.frontend.entryPoints: websecure
              # demo-Middleware на плагине, объявленном ниже через CRD Middleware
              # (Ingress v3 синтаксис: "<namespace>/<name>"); тот же плагин из
              # file provider доступен как "keep-response-body@file".
              traefik.ingress.traefik.io.router.middlewares: "default/keep-response-body"
          spec:
            ingressClassName: traefik
            rules:
              - host: whoami.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service: {name: whoami, port: {number: 80}}
      changed_when: false

    - name: Apply demo app and Ingress
      ansible.builtin.command: k3s kubectl apply -f /tmp/whoami-ingress.yml
      register: _apply
      changed_when: "'configured' in _apply.stdout or 'created' in _apply.stdout"

    - name: Verify Traefik picked up the ingress router
      ansible.builtin.uri:
        url: https://127.0.0.1/api/http/routers
        validate_certs: false
        return_content: true
      register: _routers
      failed_when: "'whoami' not in _routers.content"

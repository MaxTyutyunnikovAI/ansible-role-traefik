---
# ============================================================================
# Configure: declarative static config (dict -> to_nice_yaml) + File Provider
# dynamic configs rendered via a loop over traefik_dynamic_configs.
# Every config change notifies the validated-restart handler chain — the
# service is restarted ONLY after a timed startup probe of the new config
# passes (see handlers/main.yml; Traefik v3 has no offline --check).
# ============================================================================

- name: Generate static Traefik configuration from traefik_static_config dict
  ansible.builtin.template:
    src: traefik.yml.j2
    dest: "{{ traefik_static_config_file }}"
    owner: "{{ traefik_config_owner }}"
    group: "{{ traefik_config_group }}"
    mode: "{{ traefik_config_mode }}"
    # No inline `validate:` here: there is no offline validator (v3 `--check`
    # does not exist and a probe run would bind the entrypoint sockets of a
    # temp file). The authoritative gate is the handler chain (see the notify
    # below): it stops the service, probes the final file with a timed
    # startup and rolls back to <config>.bak if the probe fails.
  # The rendered config can contain the pilot TRIAL token or the Kubernetes
  # bearer token (providers.*.token) — censor the task while either is set.
  no_log: "{{ (traefik_pilot_token | length > 0)
              or (traefik_kubernetes_token | length > 0) }}"
  notify: validate_and_restart_traefik

# --- Environment file with secrets (systemd EnvironmentFile) ----------------
# traefik_envs is rendered into a root-only 0600 file instead of `Environment=`
# lines in the unit: the unit must stay world-readable (0644) for inspection,
# while ACME DNS tokens etc. must not be visible there. systemd (pid1, root)
# reads EnvironmentFile before dropping privileges, so 0600 root:root works.
# no_log censors the secret values from the task output.
- name: Deploy Traefik environment file with secrets (root-only)
  ansible.builtin.copy:
    content: |
      {% for item in traefik_envs | dict2items -%}
      {{ item.key }}={{ item.value }}
      {% endfor -%}
    dest: "{{ traefik_env_file }}"
    owner: root
    group: root
    mode: "0600"
  when: traefik_envs | length > 0
  no_log: true
  notify: validate_and_restart_traefik

# `file: state=absent` is natively idempotent (no change when already absent),
# so a plain notify only fires on a real removal — no extra changed_when hacks.
- name: Remove Traefik environment file when no secrets are defined
  ansible.builtin.file:
    path: "{{ traefik_env_file }}"
    state: absent
  when: traefik_envs | length == 0
  notify: validate_and_restart_traefik

# --- Traefik v3 plugins (trial mechanism) -------------------------------------
# Plugins are interpreted (Yaegi) scripts served by pilot.traefik.io; there is
# no offline package. `traefik trial --download` pre-fetches them into
# traefik_plugins_dir so a pilot outage never blocks startup (the daemon then
# loads the cached copy). Runs AFTER the binary install task and BEFORE the
# unit is started (systemd.yml), because the daemon downloads plugins itself
# only when its config already declares them under experimental.plugins.
# Idempotency: re-download only when the cached <name>@<version>.go file is
# missing — i.e. on first install or after a version bump in traefik_plugins.
- name: Download Traefik plugins into the trial cache (traefik trial --download)
  ansible.builtin.command:
    argv:
      - "{{ traefik_bin_dir }}/traefik"
      - trial
      - "--setup={{ traefik_pilot_token }}"     # TRIAL- token, keep it in ansible-vault
      - "--download={{ item.name }}@{{ item.version }}"
    chdir: "{{ traefik_config_dir }}"           # pilot writes ./pilot.yml next to CWD
    # `creates` must live INSIDE the module options — as a top-level task key
    # it collides with the `ansible.builtin.command` action and Ansible aborts
    # with "ERROR! conflicting action statements: ansible.builtin.command, creates".
    creates: "{{ traefik_plugins_dir }}/{{ item.name }}@{{ item.version }}.go"
  loop: "{{ traefik_plugins }}"
  loop_control:
    label: "{{ item.name }}@{{ item.version }}"
  no_log: true                                  # the token appears in argv
  changed_when: true                            # "skipped (creates)" stays quiet; real fetch = change
  when:
    - traefik_pilot_enabled | bool
    - traefik_plugins | length > 0
    - not ansible_check_mode                    # the binary may not exist yet in check mode

# --- Dynamic configuration generation (File Provider) ------------------------
# Declarative source of truth for conf.d/*.yml:
#   * traefik_dynamic_configs          — list of {name, content} items, one file each;
#   * traefik_dynamic_configs_template — optional single Jinja2 template rendered into
#     <traefik_dynamic_config_dir>/<traefik_dynamic_configs_template_name>.yml. The
#     template has access to every role variable and to `traefik_dynamic_configs`, so
#     it can generate several resources/files' worth of YAML from host facts or loops.
# Both are rendered idempotently (the template module only reports a change when
# the produced bytes differ) and notify the validated-restart handler chain.
- name: Generate dynamic configuration files from traefik_dynamic_configs
  ansible.builtin.template:
    src: dynamic-config.yml.j2
    dest: "{{ traefik_dynamic_config_dir }}/{{ item.name }}{{ traefik_dynamic_configs_file_extension }}"
    owner: "{{ traefik_config_owner }}"
    group: "{{ traefik_config_group }}"
    mode: "{{ traefik_config_mode }}"
  loop: "{{ traefik_dynamic_configs }}"
  loop_control:
    label: "{{ traefik_dynamic_config_dir }}/{{ item.name }}{{ traefik_dynamic_configs_file_extension }}"
  notify: validate_and_restart_traefik

- name: Generate dynamic configuration from the custom Jinja2 template
  ansible.builtin.template:
    src: "{{ traefik_dynamic_configs_template }}"
    dest: "{{ traefik_dynamic_config_dir }}/{{ traefik_dynamic_configs_template_name }}{{ traefik_dynamic_configs_file_extension }}"
    owner: "{{ traefik_config_owner }}"
    group: "{{ traefik_config_group }}"
    mode: "{{ traefik_config_mode }}"
  when: traefik_dynamic_configs_template | length > 0
  notify: validate_and_restart_traefik

# Cleanup symmetric to the "Remove default middlewares file..." task below:
# when the option is unset the generated file must disappear. `file:
# state=absent` reports no change for an already-absent file, so the plain
# notify below only fires on a real removal — idempotence stays intact.
- name: Remove template-based dynamic config when the option is unset
  ansible.builtin.file:
    path: "{{ traefik_dynamic_config_dir }}/{{ traefik_dynamic_configs_template_name }}{{ traefik_dynamic_configs_file_extension }}"
    state: absent
  when: traefik_dynamic_configs_template | length == 0
  notify: validate_and_restart_traefik

# --- PRESET MIDDLEWARES (00-default-middlewares.yml) ------------------------
# htpasswd file for dashboard auth (usersFile mode, when no inline users given)
- name: Generate dashboard htpasswd from vault-provided password
  community.general.htpasswd:
    name: "{{ traefik_dashboard_admin_user }}"
    password: "{{ traefik_dashboard_admin_password }}"
    path: "{{ traefik_dashboard_htpasswd_file }}"
    crypt_scheme: apr_md5_crypt
    owner: "{{ traefik_config_owner }}"
    group: "{{ traefik_config_group }}"
    mode: "0640"
  no_log: true
  notify: validate_and_restart_traefik
  when:
    - traefik_enable_dashboard_basic_auth | bool
    - traefik_dashboard_basic_auth | length == 0
    - traefik_dashboard_admin_password | length > 0

- name: Auto-generate dashboard htpasswd and admin password file
  when:
    - traefik_enable_dashboard_basic_auth | bool
    - traefik_dashboard_basic_auth | length == 0
    - traefik_dashboard_admin_password | length == 0
  block:
    - name: Stat existing dashboard auth files
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ traefik_dashboard_password_file }}"
        - "{{ traefik_dashboard_htpasswd_file }}"
      register: _dash_auth_stat

    - name: Read existing dashboard admin password
      ansible.builtin.slurp:
        src: "{{ traefik_dashboard_password_file }}"
      register: _dash_pass_slurp
      no_log: true
      when: _dash_auth_stat.results[0].stat.exists | default(false)

    - name: Set dashboard admin password fact (existing or new random)
      ansible.builtin.set_fact:
        _dash_admin_pass: >-
          {{ (_dash_pass_slurp.content | b64decode).strip()
             if (_dash_pass_slurp is defined and _dash_pass_slurp.content is defined
                 and (_dash_pass_slurp.content | b64decode).strip() | length > 0)
             else lookup('password', '/dev/null chars=ascii_letters,digits length=24') }}
      no_log: true

    - name: Write dashboard admin password to a root-only file
      ansible.builtin.copy:
        content: "{{ _dash_admin_pass }}\n"
        dest: "{{ traefik_dashboard_password_file }}"
        owner: root
        group: root
        mode: "0600"
      no_log: true

    - name: Create/update dashboard htpasswd from generated password
      community.general.htpasswd:
        name: "{{ traefik_dashboard_admin_user }}"
        password: "{{ _dash_admin_pass }}"
        path: "{{ traefik_dashboard_htpasswd_file }}"
        crypt_scheme: apr_md5_crypt
        owner: "{{ traefik_config_owner }}"
        group: "{{ traefik_config_group }}"
        mode: "0640"
      no_log: true
      notify: validate_and_restart_traefik

# Render the 00-default-middlewares.yml file based on enabled presets.
- name: Render default middlewares file (presets and chain)
  ansible.builtin.copy:
    content: "{{ {'http': {'middlewares': _middlewares}} | to_nice_yaml(indent=2) }}"
    dest: "{{ traefik_dynamic_config_dir }}/00-default-middlewares.yml"
    owner: "{{ traefik_config_owner }}"
    group: "{{ traefik_config_group }}"
    mode: "{{ traefik_config_mode }}"
  vars:
    _legacy_mws: "{{ traefik_default_middlewares if (traefik_default_middlewares_enabled | bool) else {} }}"
    _sec_headers_mw: >-
      {{ {'security-headers': traefik_default_middlewares['security-headers']
           | combine(traefik_security_headers_extra)}
         if (traefik_enable_security_headers | bool) else {} }}
    _rate_limit_mw: >-
      {{ {'rate-limit': {'rateLimit': {'average': traefik_rate_limit_average | int,
                                       'burst': traefik_rate_limit_burst | int,
                                       'period': traefik_rate_limit_period}}}
         if (traefik_enable_rate_limit | bool) else {} }}
    _dash_auth_mw: >-
      {{ {'dashboard-auth': {'basicAuth': {'users': traefik_dashboard_basic_auth,
                                            'realm': 'Traefik'}}}
         if (traefik_enable_dashboard_basic_auth | bool
             and (traefik_dashboard_basic_auth | length > 0))
         else {'dashboard-auth': {'basicAuth': {'usersFile': traefik_dashboard_htpasswd_file,
                                                  'realm': 'Traefik'}}}
         if (traefik_enable_dashboard_basic_auth | bool)
         else {} }}
    _chain_items: >-
      {{ (['security-headers'] if (traefik_enable_security_headers | bool) else [])
         + (['rate-limit'] if (traefik_enable_rate_limit | bool) else []) }}
    _chain_mw: >-
      {{ {traefik_middlewares_chain_name: {'chain': {'middlewares': _chain_items}}}
         if (_chain_items | length > 0) else {} }}
    _middlewares: >-
      {{ _legacy_mws
         | combine(_sec_headers_mw)
         | combine(_rate_limit_mw)
         | combine(_dash_auth_mw)
         | combine(_chain_mw) }}
  when: >-
    (traefik_default_middlewares_enabled | bool)
    or (traefik_enable_security_headers | bool)
    or (traefik_enable_rate_limit | bool)
    or (traefik_enable_dashboard_basic_auth | bool)
  notify: validate_and_restart_traefik

# Dashboard router (File Provider dynamic config). Needed because the role's
# default static config keeps `api.insecure: false`: with insecure off the
# dashboard/api is ONLY reachable through a named router bound to an existing
# entryPoint. Protect it via traefik_dashboard_middlewares (e.g. the
# dashboard-auth basicAuth middleware or the "internal" ipAllowList built
# from traefik_dashboard_trusted_ips).
- name: Render dashboard router dynamic configuration
  ansible.builtin.template:
    src: dashboard-router.yml.j2
    dest: "{{ traefik_dynamic_config_dir }}/05-dashboard.yml"
    owner: "{{ traefik_config_owner }}"
    group: "{{ traefik_config_group }}"
    mode: "{{ traefik_config_mode }}"
  when: traefik_dashboard_enabled | bool
  notify: validate_and_restart_traefik

- name: Remove dashboard router file when the option is disabled
  ansible.builtin.file:
    path: "{{ traefik_dynamic_config_dir }}/05-dashboard.yml"
    state: absent
  when: not (traefik_dashboard_enabled | bool)
  notify: validate_and_restart_traefik

- name: Remove default middlewares file when all presets are disabled
  ansible.builtin.file:
    path: "{{ traefik_dynamic_config_dir }}/00-default-middlewares.yml"
    state: absent
  when: >-
    not (traefik_default_middlewares_enabled | bool)
    and not (traefik_enable_security_headers | bool)
    and not (traefik_enable_rate_limit | bool)
    and not (traefik_enable_dashboard_basic_auth | bool)
  notify: validate_and_restart_traefik

# --- Default TLS certificate from file (cert-manager helper, no-k8s variant) ---
- name: Render default TLS certificate file (file-based fallback)
  ansible.builtin.copy:
    content: "{{ {'tls': {'stores': {'default': {'defaultCertificate': traefik_default_certificate}}}} | to_nice_yaml(indent=2) }}\n"
    dest: "{{ traefik_dynamic_config_dir }}/tls-default-cert.yml"
    owner: "{{ traefik_config_owner }}"
    group: "{{ traefik_config_group }}"
    mode: "{{ traefik_config_mode }}"
  when: traefik_default_certificate | length > 0
  notify: validate_and_restart_traefik

- name: Remove default TLS certificate file when option is unset
  ansible.builtin.file:
    path: "{{ traefik_dynamic_config_dir }}/tls-default-cert.yml"
    state: absent
  when: traefik_default_certificate | length == 0
  notify: validate_and_restart_traefik

# NOTE ON DYNAMIC CONFIG VALIDATION (verified empirically with Traefik v3):
# dynamic File Provider resources are loaded at runtime (providers.file.watch
# applies them without a restart), and TLS options are resolved only during an
# actual handshake — there is no safe offline schema-validation for them.
# The authoritative gate before any restart is the static-config startup probe
# performed in the handler chain (see handlers/main.yml).

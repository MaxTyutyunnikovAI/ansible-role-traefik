---
# ============================================================================
# Configure: declarative static config (dict -> to_nice_yaml) + File Provider
# dynamic configs rendered via a loop over traefik_dynamic_configs.
# Every config change notifies the validated-restart handler chain — the
# service is restarted ONLY if `traefik --check` passes (see handlers).
# ============================================================================

- name: Generate static Traefik configuration from traefik_static_config dict
  ansible.builtin.template:
    src: traefik.yml.j2
    dest: "{{ traefik_static_config_file }}"
    owner: "{{ traefik_config_owner }}"
    group: "{{ traefik_config_group }}"
    mode: "{{ traefik_config_mode }}"
    # No inline `validate:` here: `traefik --check` binds entrypoint sockets,
    # which would make temp-file validation hang/conflict with the running
    # instance. The final file is validated in the handler chain (below the
    # notify) before any restart — that is the authoritative gate.
  notify: validate_and_restart_traefik

# --- Traefik v3 plugins (trial mechanism) -------------------------------------
# Plugins are interpreted (Yaegi) scripts served by pilot.traefik.io; there is
# no offline package. `traefik trial --download` pre-fetches them into
# traefik_plugins_dir so a pilot outage never blocks startup (the daemon then
# loads the cached copy). Runs AFTER the binary install task and BEFORE the
# unit is started (systemd.yml), because the daemon downloads plugins itself
# only when its config already declares them under experimental.plugins.
# Idempotency: re-download only when the cached <name>@<version>.go file is
# missing — i.e. on first install or after a version bump in traefik_plugins.
- name: Download Traefik plugins into the trial cache (traefik trial --download)
  ansible.builtin.command:
    argv:
      - "{{ traefik_bin_dir }}/traefik"
      - trial
      - "--setup={{ traefik_pilot_token }}"     # TRIAL- token, keep it in ansible-vault
      - "--download={{ item.name }}@{{ item.version }}"
    chdir: "{{ traefik_config_dir }}"           # pilot writes ./pilot.yml next to CWD
    # `creates` must live INSIDE the module options — as a top-level task key
    # it collides with the `ansible.builtin.command` action and Ansible aborts
    # with "ERROR! conflicting action statements: ansible.builtin.command, creates".
    creates: "{{ traefik_plugins_dir }}/{{ item.name }}@{{ item.version }}.go"
  loop: "{{ traefik_plugins }}"
  loop_control:
    label: "{{ item.name }}@{{ item.version }}"
  no_log: true                                  # the token appears in argv
  changed_when: true                            # "skipped (creates)" stays quiet; real fetch = change
  when:
    - traefik_pilot_enabled | bool
    - traefik_plugins | length > 0
    - not ansible_check_mode                    # the binary may not exist yet in check mode

- name: Render dynamic configuration files (File Provider) from traefik_dynamic_configs
  ansible.builtin.copy:
    # Each item.content dict is serialized declaratively with to_nice_yaml.
    content: "{{ item.content | to_nice_yaml(indent=2) }}"
    dest: "{{ traefik_dynamic_config_dir }}/{{ item.name }}.yml"
    owner: "{{ traefik_config_owner }}"
    group: "{{ traefik_config_group }}"
    mode: "{{ traefik_config_mode }}"
  loop: "{{ traefik_dynamic_configs }}"
  loop_control:
    label: "{{ traefik_dynamic_config_dir }}/{{ item.name }}.yml"
  notify: validate_and_restart_traefik

- name: Render default middlewares file (security headers, https redirect)
  ansible.builtin.copy:
    content: "{{ {'http': {'middlewares': _middlewares}} | to_nice_yaml(indent=2) }}"
    dest: "{{ traefik_dynamic_config_dir }}/00-default-middlewares.yml"
    owner: "{{ traefik_config_owner }}"
    group: "{{ traefik_config_group }}"
    mode: "{{ traefik_config_mode }}"
  vars:
    # traefik_default_middlewares + optional dashboard basicAuth middleware
    # (basicAuth is only emitted when htpasswd users are provided — an empty
    # list would make the router reject every request).
    _middlewares: >-
      {{ traefik_default_middlewares
         | combine(({'dashboard-auth': {'basicAuth': {'users': traefik_dashboard_basic_auth}}}
                    if (traefik_dashboard_basic_auth | length > 0) else {})) }}
  when: traefik_default_middlewares_enabled | bool
  notify: validate_and_restart_traefik

- name: Remove default middlewares file when the option is disabled
  ansible.builtin.file:
    path: "{{ traefik_dynamic_config_dir }}/00-default-middlewares.yml"
    state: absent
  when: not (traefik_default_middlewares_enabled | bool)
  # `file: state=absent` reports "changed" on every run for missing files,
  # which would break idempotence; only a real removal (existed before) is a
  # change worth notifying.
  changed_when: file_result.stat.exists | default(false)
  register: file_result
  notify: validate_and_restart_traefik

# NOTE ON DYNAMIC CONFIG VALIDATION (verified empirically with Traefik v3):
# `traefik --configFile=<file> --check` validates ONLY static configuration and
# binds entrypoint sockets while checking. File Provider dynamic resources are
# loaded at runtime (providers.file.watch=true applies them without a restart),
# and TLS options are resolved only during an actual handshake — so there is no
# safe offline schema-validation for them. The authoritative gate before any
# restart is the static-config validation performed in the handler chain.

---
# ============================================================================
# Install: system group/user, directory layout, Traefik v3 binary from GitHub.
# Idempotency: the tar.gz is downloaded/unpacked only when the installed
# binary is missing or reports a version different from traefik_version.
# ============================================================================

- name: Assert that the target uses systemd as init system
  ansible.builtin.assert:
    that: ansible_facts["service_mgr"] == "systemd"
    fail_msg: "This role requires a systemd-based distribution."
    quiet: true

- name: Create Traefik system group
  ansible.builtin.group:
    name: "{{ traefik_system_group }}"
    state: present
    system: true
  when: traefik_system_group != "root"

- name: Create Traefik system user
  ansible.builtin.user:
    name: "{{ traefik_system_user }}"
    group: "{{ traefik_system_group }}"
    shell: /usr/sbin/nologin          # no interactive login for the service account
    system: true
    create_home: false
    home: "{{ traefik_data_dir }}"
    state: present
  when: traefik_system_user != "root"

- name: Ensure Traefik directories exist with correct ownership and modes
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default(traefik_system_user) }}"
    group: "{{ item.group | default(traefik_system_group) }}"
    mode: "{{ item.mode | default(traefik_directory_mode) }}"
    # The plugins dir is pilot-only — its own task below carries the
    # `when: traefik_pilot_enabled` guard (a `when` key inside a loop item
    # is silently ignored by Ansible).
  loop:
    - path: "{{ traefik_bin_dir }}"
      owner: root
      group: root
      mode: "0755"
    - path: "{{ traefik_config_dir }}"
      owner: "{{ traefik_config_owner }}"
      group: "{{ traefik_config_group }}"
    - path: "{{ traefik_dynamic_config_dir }}"
      owner: "{{ traefik_config_owner }}"
      group: "{{ traefik_config_group }}"
    - path: "{{ traefik_log_dir }}"
    - path: "{{ traefik_data_dir }}"
  loop_control:
    label: "{{ item.path }}"

# Plugin cache dir (traefik trial downloads Yaegi sources here at startup);
# owned by the service user because the daemon must be able to write it.
- name: Ensure the Traefik plugin cache directory exists (pilot only)
  ansible.builtin.file:
    path: "{{ traefik_plugins_dir }}"
    state: directory
    owner: "{{ traefik_config_owner }}"
    group: "{{ traefik_config_group }}"
    mode: "{{ traefik_directory_mode }}"
  when: traefik_pilot_enabled | bool

- name: Check whether the Traefik binary is already present
  ansible.builtin.stat:
    path: "{{ traefik_bin_dir }}/traefik"
  register: traefik_binary_stat
  changed_when: false
  check_mode: false

- name: Get currently installed Traefik version
  ansible.builtin.command:
    argv:
      - "{{ traefik_bin_dir }}/traefik"
      - version
  register: traefik_installed_version
  changed_when: false
  failed_when: false
  check_mode: false
  when: traefik_binary_stat.stat.exists | bool

# needs_install is True on first run or when the pinned version has changed.
# `traefik version` prints "Version:  3.6.2" WITHOUT the leading "v" of the
# git tag, so the tag is stripped and the version is extracted with an exact
# regex — a plain substring check would treat 3.7.1 as satisfied by 3.7.14.
# The version is extracted WITHOUT a regex_search backref argument: the
# backref form parses its "\1" argument differently across Ansible versions
# (AttributeError on some) and returns a list on others, which made the
# comparison always unequal. regex_search on a group-less pattern returns a
# plain string (or None on no match -> "" -> reinstall, fail-safe).
- name: Determine if Traefik binary must be (re)installed
  ansible.builtin.set_fact:
    traefik_needs_install: >-
      {{ not (traefik_binary_stat.stat.exists | bool)
         or ((_traefik_installed_version | trim) != (_traefik_want_version | trim)) }}
  vars:
    _traefik_want_version: >-
      {{ traefik_version[1:] if traefik_version is match('^v') else traefik_version }}
    _traefik_installed_version: >-
      {{ (traefik_installed_version.stdout | default('')
          | regex_search('Version:\s*\S+')
          | default('', true)
          | regex_replace('^Version:\s*', '')) }}

- name: Download and unpack Traefik release tarball from GitHub
  when: traefik_needs_install | bool
  block:
    - name: Create temporary download directory
      ansible.builtin.file:
        path: "{{ traefik_download_tmp_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Unarchive Traefik binary archive (remote_src, no same owner)
      ansible.builtin.unarchive:
        src: "{{ traefik_binary_url }}"
        dest: "{{ traefik_download_tmp_dir }}"
        remote_src: true
        extra_opts:
          - --no-same-owner
        creates: "{{ traefik_download_tmp_dir }}/traefik"
        # Opt-in integrity check: set traefik_binary_checksum ("sha256:<hex>")
        # when pinning a new version (value from the GitHub release checksums).
        checksum: "{{ traefik_binary_checksum | default('') | ternary(traefik_binary_checksum, omit) }}"

    - name: Install Traefik binary into {{ traefik_bin_dir }}
      ansible.builtin.copy:
        src: "{{ traefik_download_tmp_dir }}/traefik"
        dest: "{{ traefik_bin_dir }}/traefik"
        owner: root
        group: root
        mode: "0755"
        remote_src: true
      # A new binary must actually replace the running daemon, so the copy
      # notifies the validated-restart chain — the restart still only happens
      # after the startup probe of the current config passes (handlers).
      notify: validate_and_restart_traefik

    - name: Remove temporary download directory
      ansible.builtin.file:
        path: "{{ traefik_download_tmp_dir }}"
        state: absent

- name: Restore SELinux context for the Traefik binary
  ansible.builtin.command:
    argv:
      - restorecon
      - -v
      - "{{ traefik_bin_dir }}/traefik"
  register: traefik_restorecon
  changed_when: "'relabeled' in traefik_restorecon.stdout"
  when:
    - ansible_facts["selinux"] is defined
    - ansible_facts["selinux"].status == "enabled"
    - not ansible_check_mode

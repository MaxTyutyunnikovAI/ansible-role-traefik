---
# Lint & test on every push / pull request.
name: CI

'on':
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ansible-lint)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the codebase
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install lint tooling
        run: pip install --upgrade pip ansible-core ansible-lint yamllint

      - name: Yamllint
        run: yamllint .

      - name: Ansible-lint
        run: ansible-lint

  molecule:
    name: Molecule (default, RockyLinux 9)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Check out the codebase
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install molecule with docker driver
        run: pip install --upgrade pip "molecule-plugins[docker]" molecule ansible-core

      - name: Run molecule test
        run: molecule test
        env:
          PY_COLORS: '1'
          ANSIBLE_FORCE_COLOR: '1'

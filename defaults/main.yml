---
# ============================================================================
# Traefik v3 role — defaults (all values overridable from inventory/vars)
# ============================================================================

# Version & download -------------------------------------------------------
traefik_version: "v3.7.14"                     # pinned v3.x release tag
traefik_repo_url: "https://github.com/traefik/traefik"
traefik_binary_url: "{{ traefik_repo_url }}/releases/download/{{ traefik_version }}/traefik_{{ traefik_version }}_linux_{{ go_arch }}.tar.gz"
# Optional sha256 of the tarball (from the GitHub release checksums file).
# Empty string keeps the download unverified (checksum files change format
# across releases, so verification is opt-in per version bump).
traefik_binary_checksum: ""                    # e.g. "sha256:<64 hex chars>"
traefik_download_tmp_dir: "/tmp/traefik-download"

# Users / paths ------------------------------------------------------------
traefik_service_name: "traefik"
traefik_system_user: "traefik"
traefik_system_group: "traefik"
traefik_bin_dir: "/usr/local/bin"
traefik_config_dir: "/etc/traefik"
traefik_static_config_file: "{{ traefik_config_dir }}/traefik.yml"
# Rollback point: advanced by the handler chain ONLY after a successful
# validation probe (see handlers/main.yml), restored on a failed probe.
traefik_config_backup_file: "{{ traefik_static_config_file }}.bak"
traefik_dynamic_config_dir: "{{ traefik_config_dir }}/conf.d"   # File Provider directory
traefik_log_dir: "/var/log/traefik"
traefik_data_dir: "/var/lib/traefik"           # acme.json, runtime state
# Catalog for Traefik Yaegi plugins downloaded by the "traefik trial" mechanism
# (pilot.traefik.io). Must be writable by the service user — added to the unit's
# ReadWritePaths automatically when traefik_pilot_enabled is true.
traefik_plugins_dir: "{{ traefik_config_dir }}/plugins-trial"

# Ownership / modes ----------------------------------------------------------
traefik_config_owner: "{{ traefik_system_user }}"
traefik_config_group: "{{ traefik_system_group }}"
traefik_config_mode: "0640"
traefik_directory_mode: "0750"

# Systemd unit knobs ---------------------------------------------------------
traefik_start_timeout: 30                      # StartSec in seconds
traefik_restart_sec: 5                         # RestartSec in seconds
traefik_limit_nofile: 1048576
traefik_extra_capabilities: []                 # e.g. ["CAP_NET_RAW"]
# Free-form extra [Service] keys — rendered verbatim into the unit template
# (applied in templates/traefik.service.j2; values must be systemd-valid strings).
traefik_extra_unit_vars: {}                    # e.g. {TCPKeepAlive: "yes"}

# Environment passed to the daemon (ACME DNS provider keys like
# CF_API_TOKEN / ROUTER53_* live here). Rendered into a dedicated root-only
# EnvironmentFile (mode 0600) instead of `Environment=` lines — the unit file
# itself is world-readable (0644). Use ansible-vault for values in inventory.
traefik_envs: {}                               # e.g. {CF_API_TOKEN: "{{ vault_cf_token }}"}
traefik_env_file: "{{ traefik_config_dir }}/traefik.env"   # EnvironmentFile for traefik_envs

# Config validation probe (handlers/main.yml) -------------------------------
# Traefik v3 has NO offline --check mode: with --configFile the daemon
# ignores every other flag/env and starts a full server (binds the
# entrypoints). The handler chain therefore stops the service and runs a
# timed startup probe: rc 124 (SIGTERM after traefik_validate_timeout) or
# rc 137 (SIGKILL after a further traefik_validate_kill_after seconds) plus
# no error lines in the output => config valid, service is started again.
traefik_validate_timeout: 5                      # seconds the probe must survive
traefik_validate_kill_after: 10                  # extra grace before SIGKILL

# Logrotate ------------------------------------------------------------------
traefik_logrotate_enabled: true
traefik_logrotate_frequency: "daily"
traefik_logrotate_rotate: 14
traefik_logrotate_maxsize: "100M"

# ----------------------------------------------------------------------------
# STATIC CONFIGURATION (declarative dict -> rendered with to_nice_yaml(indent=2))
# Entry points web/websecure, logging, accessLog, api dashboard, file provider.
#
# IMPORTANT — extending the config from playbooks/inventory: NEVER define an
# override of `traefik_static_config` that references `traefik_static_config`
# itself (e.g. `{{ traefik_static_config | combine(...) }}` or
# `{{ traefik_static_config.providers | combine(...) }}` in role vars or in
# the same vars scope). Jinja2 resolves the name back into this very
# definition, producing a variable-resolution cycle that ends with
# "maximum recursion depth exceeded while calling a Python object".
# Merge into the canonical plain-data copies instead (defined in vars/main.yml):
#   traefik_role_defaults.traefik_static_config        (whole static config)
#   traefik_default_providers                          (the providers block)
# Example — add the docker provider without losing defaults:
#   traefik_static_config: >-
#     {{ traefik_role_defaults.traefik_static_config
#        | combine({'providers': {'docker': docker_provider_opts}},
#                  recursive=True) }}
# Keep these plain copies in sync when changing the defaults below.
# ----------------------------------------------------------------------------
traefik_static_config:
  global:
    checkNewVersion: false
    sendAnonymousUsage: false

  entryPoints:
    web:
      address: ":80"
      http:
        redirections:
          entryPoint:
            to: websecure
            scheme: https
    websecure:
      address: ":443"
      http:
        tls: {}

  log:
    level: INFO
    format: json
    filePath: "{{ traefik_log_dir }}/traefik.log"

  accessLog:
    format: json
    filePath: "{{ traefik_log_dir }}/access.log"
    fields:
      headers:
        defaultMode: drop
        names:
          User-Agent: keep

  api:
    dashboard: true
    insecure: false

  providers:
    file:
      directory: "{{ traefik_dynamic_config_dir }}"
      watch: true

# ----------------------------------------------------------------------------
# KUBERNETES PROVIDERS (kubernetesIngress / kubernetesCRD / kubernetesGateway)
# Rendered into the static config by templates/traefik.yml.j2 and MERGED into
# the existing providers block (recursive combine) — the file provider and any
# hand-merged providers (docker etc.) are preserved.
#
# Typical k3s host scenario (Traefik as a systemd service on the cluster
# node, k3s bundled traefik disabled):
#   traefik_kubernetes_enabled: true
#   traefik_kubernetes_endpoint: "https://127.0.0.1:6443"
#   traefik_kubernetes_token: "{{ traefik_k8s_token }}"          # or a file path
#   traefik_kubernetes_cert_auth_file: "/var/lib/rancher/k3s/server/tls/client-ca.crt"
#   traefik_kubernetes_crd_extra: {allowExternalNameServices: true, allowEmptyServices: true}
#
# Connection model (Traefik v3): the static config has NO `kubeconfig` field
# (v3 rejects it with "field not found" — empirically verified on v3.7.14).
# An external client is configured with endpoint + token + certAuthFilePath;
# without them Traefik falls back to the in-cluster service account, and the
# KUBECONFIG environment variable (via traefik_envs) can still supply the
# endpoint. `traefik_kubernetes_token` accepts the token VALUE or a path to a
# file containing it (Traefik v3.7+); it is a secret — the template task sets
# no_log while it is non-empty.
#
# Provider connection errors (bad token, unreachable API) are logged to the
# configured log FILE only, never to stderr — the startup probe therefore
# does not treat an unreachable cluster as a broken configuration.
#
# Provider-specific options live in per-provider *_extra dicts ON PURPOSE:
# Traefik parses static config strictly, so an option valid only for
# kubernetesCRD (e.g. allowExternalNameServices) must not leak into the
# kubernetesIngress/kubernetesGateway blocks.
# ----------------------------------------------------------------------------
traefik_kubernetes_enabled: false             # master switch for all k8s providers
traefik_kubernetes_ingress_enabled: true      # providers.kubernetesIngress
traefik_kubernetes_crd_enabled: true          # providers.kubernetesCRD
traefik_kubernetes_gateway_enabled: true      # providers.kubernetesGateway (needs Gateway API CRDs)

# Connection (shared by every enabled provider).
traefik_kubernetes_endpoint: ""               # e.g. https://127.0.0.1:6443 (k3s api)
traefik_kubernetes_token: ""                  # value or file path; keep in ansible-vault
traefik_kubernetes_cert_auth_file: ""         # CA bundle path (certAuthFilePath)

# Routing filters.
traefik_kubernetes_ingress_class: "traefik"   # "" -> no class filter (Ingress + CRD only)

# Provider-specific options (merged over the connection block, per provider).
traefik_kubernetes_ingress_extra: {}          # e.g. {namespaces: [default], labelSelector: "app=traefik"}
traefik_kubernetes_crd_extra: {}              # e.g. {allowExternalNameServices: true, allowEmptyServices: true}
traefik_kubernetes_gateway_extra: {}          # e.g. {experimentalChannel: true}

# ----------------------------------------------------------------------------
# OBSERVABILITY BLOCKS (rendered into the static config by templates/traefik.yml.j2
# via combine(), exactly like certificatesResolvers/pilot — they override the
# same keys inside traefik_static_config if you set them manually there).
# ----------------------------------------------------------------------------

# Prometheus metrics (traefik v3 `metrics.prometheus`).
traefik_prometheus_enabled: false              # true -> metrics block on the entrypoint below
traefik_prometheus_entrypoint: "metrics"       # dedicated entrypoint name; use "websecure" to reuse :443
traefik_prometheus_buckets: [0.1, 0.3, 1.2, 5.0]  # request duration histogram buckets
traefik_prometheus_entrypoint_labels: true
traefik_prometheus_service_labels: true
traefik_prometheus_router_labels: false        # high cardinality on many routers — opt-in
traefik_prometheus_extra_props: {}             # e.g. {headerLabels: {...}, manualRouting: true}

# /ping health endpoint (LB / monitoring probes). Independent of Prometheus —
# do NOT nest it under the metrics condition (upstream role bug we avoided).
traefik_ping_enabled: false
traefik_ping_entrypoint: ""                    # "" -> default entrypoint; or set to an entrypoint name, e.g. "metrics"

# serversTransport: TLS/timeout settings for Traefik -> backend connections.
# Empty dict (default) -> no serversTransport block; every knob below is only
# emitted when non-null/non-empty so partial overrides stay clean.
traefik_servers_transport_name: "insecureInternal"  # key under serversTransport map
traefik_servers_transport: {}                  # raw escape hatch, merged over the knobs below
# traefik_servers_transport:
#   insecureSkipVerify: true
#   rootCAs: ["/etc/traefik/ca/internal.pem"]
#   maxIdleConnPerHost: 50
#   responseHeaderTimeout: "30s"
#   forwardingTimeouts:
#     dialTimeout: "30s"
#     responseHeaderTimeout: "30s"
#     idleConnTimeout: "60s"

# DNS resolver behaviour (hostResolver) — needed for ACME DNS-challenge and
# custom resolver chains.
traefik_hostresolver: {}                       # e.g. {cnameFlattening: FULL, resolvConfig: /etc/resolv.conf, resolvDepth: 2}

# Distributed tracing (OTLP/Jaeger/Zipkin/Datadog/Haystack/Instana/Elastic).
# Only one exporter should be configured; `traefik_tracing_service` is required
# when enabled. Extra props (per-exporter options) go to traefik_tracing_extra.
traefik_tracing_enabled: false
traefik_tracing_service: "traefik"
traefik_tracing_span_name: "req {{ '{{'}} RouteName {{'}}' }}"  # literal Traefik template placeholders
traefik_tracing_128bit_spans: false
traefik_tracing_otlp: {}                       # e.g. {endpoint: "http://otel:4317", protocol: grpc, insecure: true}
traefik_tracing_extra: {}                      # raw merge target for anything not covered above

# ----------------------------------------------------------------------------
# CERTIFICATE RESOLVERS (ACME / Let's Encrypt)
# Declarative dict rendered into the static config as `certificatesResolvers`.
# Empty dict (default) -> no resolvers section; the default entryPoint config
# references "letsencrypt" only as an example — set traefik_enable_acme: true
# (or override this dict) to actually obtain certificates.
# DNS challenge keys (CF_API_TOKEN etc.) go to `traefik_envs`, NOT here, so
# secrets never land in the on-disk configuration file.
# ----------------------------------------------------------------------------
traefik_enable_acme: false                     # convenience switch for the block below
traefik_cert_resolvers: {}
# Example (HTTP-01 via the web entrypoint):
#   traefik_cert_resolvers:
#     letsencrypt:
#       acme:
#         email: ops@example.com
#         storage: "{{ traefik_data_dir }}/acme.json"
#         caServer: "https://acme-v02.api.letsencrypt.org/directory"
#         httpChallenge:
#           entryPoint: web
# Example (DNS-01 via Cloudflare, with traefik_envs: {CF_API_TOKEN: ...}):
#   traefik_cert_resolvers:
#     letsencrypt:
#       acme:
#         email: ops@example.com
#         storage: "{{ traefik_data_dir }}/acme.json"
#         keyType: EC256                       # RSA2048 | EC256 | EC384 | RSA4096 | RSA8192
#         dnsChallenge:
#           provider: cloudflare               # any lego DNS provider (docs/README.acme-dns-providers)
#           delayBeforeCheck: 10               # seconds; check propagation before hitting rate limits
#           resolvers: ["1.1.1.1:53", "8.8.8.8:53"]
#           disablePropagationCheck: false
# Example (TLS-ALPN-01 over websecure — no extra port needed when :443 is served):
#   traefik_cert_resolvers:
#     letsencrypt:
#       acme:
#         email: ops@example.com
#         storage: "{{ traefik_data_dir }}/acme.json"
#         tlsChallenge: {}

# ----------------------------------------------------------------------------
# PLUGINS (Traefik v3) & PILOT (v2-era trial mechanism)
# On Traefik v3 declaring a plugin under `experimental.plugins` (via
# traefik_plugins) is ENOUGH: the daemon downloads the module from the plugin
# catalog (GitHub) at startup — no pilot, no install step, no offline cache.
# The pilot/trial path below is kept for Traefik v2 back-compat: it pre-fetches
# sources into traefik_plugins_dir with `traefik trial --download
# <name>@<version>` so a catalog outage never blocks startup, and it renders
# the `pilot` block (token) into the static config (templates/traefik.yml.j2,
# pilot.token): with --configFile the daemon ignores env vars, so traefik_envs
# would NOT reach it. Protect the token with the config file mode (0640,
# service owner) and keep the value in ansible-vault; the template task sets
# no_log while a token is defined. On Traefik v3 keep traefik_pilot_enabled:
# false — the `pilot` static block and the `traefik trial` command no longer
# exist there.
# ----------------------------------------------------------------------------
traefik_pilot_enabled: false                   # true -> pilot block + plugins dir + ReadWritePaths (Traefik v2 only)
traefik_pilot_token: ""                        # TRIAL token (pilot.traefik.io); keep it in ansible-vault
traefik_pilot_extra_props: {}                  # e.g. {onerror: ignore} — unknown modules won't stop startup
# Plugins to install: [{name, version, moduleName}] — name usually "<author><plugin>".
# Rendered into experimental.plugins; on Traefik v3 the daemon fetches them at startup.
traefik_plugins: []
# Example:
#   traefik_plugins:
#     - name: geohamster-keep
#       version: v0.1.0
#       moduleName: github.com/geohamster/traefik-plugin

# ----------------------------------------------------------------------------
# DYNAMIC CONFIGURATION (File Provider). Each list item is rendered as a
# separate YAML file into traefik_dynamic_config_dir via a loop in configure.yml
# (templates/dynamic-config.yml.j2 -> `content` dict serialized with
# to_nice_yaml; files are picked up by the file provider thanks to watch: true,
# so a restart handler notification applies them without downtime).
# ----------------------------------------------------------------------------
traefik_dynamic_configs:
  - name: tls-options
    content:
      tls:
        options:
          default:
            minVersion: VersionTLS12
            sniStrict: true
            cipherSuites:
              - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
              - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
              - TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305
              - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305
            curvePreferences:
              - CurveP521
              - CurveP384
  # Example of an additional dynamic file (routers/services) can be added here:
  # - name: shared-routers
  #   content:
  #     http:
  #       routers: ...

# ----------------------------------------------------------------------------
# EXTRA DYNAMIC CONFIGURATION (File Provider). Same {name, content} item shape
# as traefik_dynamic_configs, but appended to the same render loop in
# configure.yml instead of overriding the default list — set it from a playbook
# to add project-specific files (middlewares, routers) WITHOUT copying the
# built-in tls-options item out of the defaults.
# ----------------------------------------------------------------------------
traefik_dynamic_configs_extra: []

# ----------------------------------------------------------------------------
# DYNAMIC CONFIGURATION — TEMPLATE-BASED GENERATION (optional)
# Path to a custom Jinja2 template rendered into ONE extra dynamic-config file
# in traefik_dynamic_config_dir. Use it when the declarative list is not enough:
# inside the template you have access to all role variables, ansible_facts and
# `traefik_dynamic_configs`, so routers/services/middlewares can be generated
# dynamically (e.g. from a per-host inventory dict or a loop over facts).
# Relative paths are resolved against the role's templates/ directory; absolute
# paths on the controller work too. Empty string (default) -> feature disabled,
# and any previously generated file is cleaned up idempotently.
# ----------------------------------------------------------------------------
traefik_dynamic_configs_template: ""           # e.g. "dynamic-routers.yml.j2"
traefik_dynamic_configs_template_name: "90-generated"   # filename without extension
traefik_dynamic_configs_file_extension: ".yml"          # File Provider watches *.yml/*.yaml

# ----------------------------------------------------------------------------
# OPTIONAL DEFAULT MIDDLEWARES (rendered into conf.d/00-default-middlewares.yml
# when traefik_default_middlewares_enabled is true). Reference them from any
# router: http.routers.<name>.middlewares: [security-headers, https-redirect].
# ----------------------------------------------------------------------------
traefik_default_middlewares_enabled: false
traefik_hsts_max_age: 31536000                 # 1 year
traefik_default_middlewares:
  security-headers:
    headers:
      stsSeconds: "{{ traefik_hsts_max_age }}"
      stsIncludeSubdomains: true
      stsPreload: true
      forceSTSHeader: true
      contentTypeNosniff: true
      browserXssFilter: true
      frameDeny: true
      referrerPolicy: "no-referrer-when-downgrade"
  https-redirect:
    redirectScheme:
      scheme: https
      permanent: true

# ----------------------------------------------------------------------------
# DASHBOARD ROUTER & ACCESS CONTROL (dynamic config via File Provider)
# When traefik_dashboard_enabled is true the role renders conf.d/05-dashboard.yml
# exposing the API dashboard on the api entrypoint. With `api.insecure: false`
# (the default) the dashboard is ONLY reachable through this router, so you can
# protect it with basicAuth (traefik_dashboard_auth_enabled / _password -> the
# "dashboard-auth" middleware in 00-default-middlewares.yml) and/or extra
# middlewares such as ipAllowList. Set traefik_dashboard_entrypoint to an
# existing entryPoint name (default: websecure).
# ----------------------------------------------------------------------------
traefik_dashboard_enabled: false
traefik_dashboard_entrypoint: "websecure"
traefik_dashboard_rule: "Host(`{{ traefik_dashboard_host | default('traefik.' + (ansible_facts['domain'] | default('localhost'))) }}`)"
traefik_dashboard_middlewares: "{{ ['dashboard-auth'] if (traefik_dashboard_enabled | bool and traefik_dashboard_auth_enabled | bool) else [] }}"
# Named IP allow-list middleware rendered together with the dashboard file:
traefik_dashboard_trusted_ips: []              # e.g. ["10.0.0.0/8", "127.0.0.1/32"]

# ----------------------------------------------------------------------------
# KUBERNETES RBAC / TOKEN (task: kubernetes.yml)
# When traefik_kubernetes_rbac_enabled is true the role auto-creates
# ServiceAccount, ClusterRole, ClusterRoleBinding and a
# service-account-token Secret in the cluster, writes the token and CA to
# static files and sets traefik_kubernetes_token / cert_auth_file for the
# Traefik kubernetes provider variables (set_fact, no_log on secrets).
# The k8s modules run on the target host using kubeconfig
# traefik_k8s_kubeconfig (delegate_to via traefik_k8s_rbac_delegate_to).
# ----------------------------------------------------------------------------
traefik_kubernetes_rbac_enabled: false             # master switch
traefik_kubernetes_rbac_namespace: "traefik"
traefik_kubernetes_rbac_create_namespace: true
traefik_kubernetes_rbac_sa_name: "traefik-external"
traefik_kubernetes_rbac_cluster_role_name: "traefik-external"
traefik_kubernetes_rbac_binding_name: "traefik-external"
traefik_kubernetes_rbac_token_secret_name: "traefik-external-token"
# Fine-grained default rules; append custom rules with this var.
traefik_k8s_cluster_role_rules: []
traefik_k8s_rbac_extra_rules: []
# Connection: kubeconfig path; run on target (empty) or delegate.
traefik_k8s_kubeconfig: "/etc/rancher/k3s/k3s.yaml"
traefik_k8s_rbac_delegate_to: ""
# Token is written to this file (path-based — Traefik v3.7+ re-reads from
# the file at provider init; no secret lands in the static config).
traefik_k8s_token_file: "{{ traefik_config_dir }}/k8s-token"
# CA bundle from the cluster kubeconfig (not the k3s client-ca.crt — the
# authoritative CA that signed the kube-apiserver serving certificate).
traefik_k8s_ca_file: "{{ traefik_config_dir }}/k3s-client-ca.crt"
# Dump the token to the controller for vault-based workflows (no_log).
traefik_k8s_dump_token_locally: false
traefik_k8s_dump_token_path: "~/.cache/w0.traefik/k8s-token"

# ----------------------------------------------------------------------------
# CERT-MANAGER / TLSStore (kubernetes CRD)
# When the kubernetesCRD provider is enabled and the Traefik CRDs are
# installed in the cluster, the role can create a k8s TLSStore resource
# pointing at a cert-manager Secret for the default certificate.
# In the static config the dangling "certResolver: letsencrypt" is removed
# (only emitted when ACME resolvers actually exist).
# ----------------------------------------------------------------------------
traefik_k8s_tls_store_enabled: false
traefik_k8s_tls_store_secret_name: ""            # e.g. wildcard-tls (cert-manager)
traefik_k8s_tls_store_namespace: "{{ traefik_kubernetes_rbac_namespace }}"

# File-provider fallback (no k8s): {certFile: path, keyFile: path}
traefik_default_certificate: {}                   # rendered into conf.d/tls-store.yml

# ----------------------------------------------------------------------------
# PRESET MIDDLEWARES (File Provider — rendered into 00-default-middlewares.yml)
# Independent booleans that each add a middleware definition plus a chain
# middleware (traefik_middlewares_chain_name) that groups the active ones.
# LEGACY traefik_default_middlewares_enabled is still supported and adds
# its dict (security-headers + https-redirect) as before.
# ----------------------------------------------------------------------------
traefik_enable_security_headers: true
traefik_security_headers_extra: {}                # merged over default headers
traefik_enable_rate_limit: false
traefik_rate_limit_average: 100
traefik_rate_limit_burst: 50
traefik_rate_limit_period: "1s"
# Dashboard basic-auth: единственный режим — usersFile (хеши не хранятся в
# динамической конфигурации). Пароль обязателен при включённой авторизации
# (assert в configure.yml); автогенерация удалена.
traefik_dashboard_auth_enabled: true
traefik_dashboard_user: "admin"
traefik_dashboard_password: ""                  # из vault; обязателен при auth_enabled
traefik_dashboard_auth_file: "{{ traefik_config_dir }}/dashboard-htpasswd"  # internal
traefik_middlewares_chain_name: "web-chain"

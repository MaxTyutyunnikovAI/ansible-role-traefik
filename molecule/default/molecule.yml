---
# Molecule scenario: docker driver, RockyLinux 9 (systemd-based target).
role_name_check: 1

dependency:
  name: galaxy
  # Explicitly point at the repo-level requirements.yml so the galaxy
  # dependency step always resolves it (previously reported "2 missing").
  options:
    requirements-file: ../../../requirements.yml

driver:
  name: docker

platforms:
  - name: instance
    image: rockylinux/rockylinux:9
    # systemd needs privileged mode + cgroup delegation inside docker
    privileged: true
    command: /sbin/init
    tmpfs:
      - /run
      - /tmp
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    capabilities:
      - SYS_ADMIN
    groups:
      - traefik_servers

provisioner:
  name: ansible
  config_options:
    defaults:
      # Avoid interpreter-discovery warnings inside the minimal container.
      interpreter_python: auto_silent
  playbooks:
    converge: converge.yml
    prepare: prepare.yml
    verify: verify.yml
  inventory:
    group_vars:
      traefik_servers:
        traefik_version: v3.6.2
        traefik_static_config:
          entryPoints:
            web:
              address: ":80"
            websecure:
              address: ":443"
          log:
            level: INFO
          api:
            dashboard: false
            insecure: false
          providers:
            file:
              directory: /etc/traefik/conf.d
              watch: true

verifier:
  name: ansible

scenario:
  test_sequence:
    - dependency
    # 'cleanup' removed from the sequence: this scenario has no cleanup.yml
    # and its absence produced "Missing playbook" warnings on every run;
    # the destroy action below already covers teardown.
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - side_effect
    - verify
    - destroy

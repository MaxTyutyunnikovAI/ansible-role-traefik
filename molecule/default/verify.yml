---
# Verify playbook for the default Molecule scenario.
# Post-converge assertions: binary + pinned version, offline config
# validation (`traefik --check`), enabled/running service, listening
# entrypoints, rendered dynamic configs, logrotate file.
- name: Verify Traefik role outcome
  hosts: all
  become: true
  gather_facts: true

  tasks:
    - name: Check that the Traefik binary is installed
      ansible.builtin.stat:
        path: "{{ traefik_bin_dir }}/traefik"
      register: traefik_bin
      failed_when: not traefik_bin.stat.exists

    - name: Get installed Traefik version
      ansible.builtin.command:
        argv:
          - "{{ traefik_bin_dir }}/traefik"
          - version
      register: traefik_ver
      changed_when: false

    - name: Assert installed version matches the pinned traefik_version
      ansible.builtin.assert:
        that:
          - >-
            (traefik_version[1:] if traefik_version is match('^v') else traefik_version)
            in traefik_ver.stdout
        fail_msg: "Expected {{ traefik_version }}, got: {{ traefik_ver.stdout }}"

    - name: Check static configuration file exists
      ansible.builtin.stat:
        path: "{{ traefik_static_config_file }}"
      register: traefik_cfg
      failed_when: not traefik_cfg.stat.exists

    - name: Validate static configuration offline (traefik --check)
      ansible.builtin.command:
        argv:
          - "{{ traefik_bin_dir }}/traefik"
          - "--configFile={{ traefik_static_config_file }}"
          - "--check=true"
      changed_when: false

    - name: Gather Traefik service status
      ansible.builtin.systemd:
        name: "{{ traefik_service_name }}"
      register: traefik_svc

    - name: Assert the service is enabled and running
      ansible.builtin.assert:
        that:
          - traefik_svc.status.enabled | bool
          - traefik_svc.status.ActiveState == "active"
        fail_msg: "Traefik service is not enabled/running: {{ traefik_svc.status }}"

    - name: Ensure iproute is present for socket checks
      ansible.builtin.package:
        name: iproute
        state: present

    - name: Collect listening TCP sockets
      ansible.builtin.command: ss -ltn
      register: ss_out
      changed_when: false

    - name: Assert web (:80) and websecure (:443) entrypoints are listening
      ansible.builtin.assert:
        that:
          - "':80' in ss_out.stdout"
          - "':443' in ss_out.stdout"
        fail_msg: "Entrypoint ports missing from `ss -ltn`:\n{{ ss_out.stdout }}"

    # Functional check of the :80 entrypoint: with the default config it must
    # answer with a 301 redirect to https (web -> websecure redirections).
    - name: Ensure curl is available for HTTP checks
      ansible.builtin.package:
        name: curl
        state: present

    - name: Request http://localhost/ through the web entrypoint
      ansible.builtin.uri:
        url: http://localhost/
        follow_redirects: none
        status_code: [200, 301, 302, 308]
      register: web_probe

    - name: Assert the web entrypoint redirects to HTTPS
      ansible.builtin.assert:
        that:
          - web_probe.status in [301, 302, 308]
          - "'https://' in (web_probe.location | default(''))"
        fail_msg: >-
          Expected an HTTPS redirect from :80, got status={{ web_probe.status }}
          location={{ web_probe.location | default('<none>') }}

    # TLS handshake on :443 must succeed at the TCP/TLS layer even without a
    # resolvable certificate (Traefik serves its self-signed fallback cert).
    - name: Probe the TLS endpoint on :443
      ansible.builtin.command:
        argv: ["curl", "-sk", "--max-time", "5", "https://localhost/"]
      register: tls_probe
      changed_when: false
      failed_when: "tls_probe.rc not in [0, 35, 52, 56]"

    # The systemd unit must stay hardened and honour the tuning knobs.
    - name: Read the deployed systemd unit
      ansible.builtin.slurp:
        src: "/etc/systemd/system/{{ traefik_service_name }}.service"
      register: unit_file

    - name: Assert key hardening directives are present in the unit
      vars:
        unit_content: "{{ unit_file.content | b64decode }}"
      ansible.builtin.assert:
        that:
          - "'NoNewPrivileges=true' in unit_content"
          - "'ProtectSystem=full' in unit_content"
          - "'CAP_NET_BIND_SERVICE' in unit_content"
          - "'{{ traefik_limit_nofile }}' in unit_content"
        fail_msg: "systemd unit lost hardening directives:\n{{ unit_content }}"

    - name: Find rendered dynamic configuration files
      ansible.builtin.find:
        paths: "{{ traefik_dynamic_config_dir }}"
        patterns: "*.yml"
      register: dyn_files

    - name: Assert at least one dynamic config file was deployed
      ansible.builtin.assert:
        that: dyn_files.matched >= 1
        fail_msg: "No dynamic config files found in {{ traefik_dynamic_config_dir }}"

    - name: Check logrotate configuration is deployed
      ansible.builtin.stat:
        path: /etc/logrotate.d/traefik
      register: lr
      failed_when: not lr.stat.exists
